name: sdk
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p libcram-core --features ebpf --locked
        if: runner.os == 'Linux'
      - run: cargo bench -p libcram-bench --no-run --locked
      - run: just header-tool header-check
      - run: just python-tools bindings
      - run: just torch-tools torch-test
      - run: python3 -m unittest discover -s scripts -p test_entropy_budget.py
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test -p libcram-core --features ebpf --locked
